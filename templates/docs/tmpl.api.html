<!doctype html>
<!--
    NOTE:
      Template of the clickable API documentation, filled by scripts/ConvertTo-UnwireHtml.ps1:
      the TITLE placeholder in <title> becomes the HTML-escaped info.title, the SPEC_JSON
      placeholder in the JSON script block the spec. They appear nowhere else.
      Self-contained: no CDN, no network, opens offline from the file system.

      Every value of the spec is untrusted (it comes from downloaded code), so the page only
      ever writes it with textContent, never as HTML.

      Chapters (script):
        HELPERS             DOM builder, $ref resolution and small formatters.
        LOAD SPEC           Parses the embedded spec and flattens the operations.
        RENDER SCHEMAS      Turns a JSON schema into a nested property list.
        RENDER OPERATIONS   One collapsible card per operation.
        RENDER PAGE         Header, stats, navigation, groups and open points.
        FILTER OPERATIONS   Search and filter chips.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__UNWIRE_TITLE__</title>
    <style>
        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;
            --surface-alt: #f0efeb;
            --text: #1d1d1b;
            --muted: #6b6a65;
            --border: #e2e0da;
            --accent: #3b5bdb;
            --get: #2b8a3e;
            --post: #1971c2;
            --put: #e67700;
            --patch: #9c36b5;
            --delete: #c92a2a;
            --other: #495057;
            --high: #2b8a3e;
            --medium: #e67700;
            --low: #c92a2a;
            --warn-bg: #fff4e6;
            --warn-border: #ffc078;
            --code: #f1f0ec;
            --radius: 8px;
            --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161615;
                --surface: #1f1f1d;
                --surface-alt: #262624;
                --text: #ecebe6;
                --muted: #9d9b94;
                --border: #34332f;
                --accent: #91a7ff;
                --get: #69db7c;
                --post: #74c0fc;
                --put: #ffc078;
                --patch: #e599f7;
                --delete: #ff8787;
                --other: #adb5bd;
                --high: #69db7c;
                --medium: #ffc078;
                --low: #ff8787;
                --warn-bg: #2b2118;
                --warn-border: #8a5a24;
                --code: #2a2a27;
            }
        }

        * { box-sizing: border-box; }
        html { scroll-padding-top: 76px; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        code, .mono { font-family: var(--mono); font-size: 0.9em; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header and toolbar */
        header { padding: 28px 24px 8px; max-width: 1280px; margin: 0 auto; }
        header h1 { margin: 0 0 4px; font-size: 1.7rem; letter-spacing: -0.01em; }
        header .version { color: var(--muted); font-size: 0.9rem; }
        header .description { margin: 10px 0 0; max-width: 820px; color: var(--muted); }
        .notice {
            margin: 16px 0 0; padding: 10px 14px; border-radius: var(--radius);
            background: var(--warn-bg); border: 1px solid var(--warn-border); font-size: 0.92rem;
        }
        .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
        .stat {
            padding: 4px 10px; border-radius: 999px; background: var(--surface);
            border: 1px solid var(--border); font-size: 0.85rem;
        }
        .stat strong { font-variant-numeric: tabular-nums; }
        .toolbar {
            position: sticky; top: 0; z-index: 5; background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .toolbar-inner {
            max-width: 1280px; margin: 0 auto; padding: 12px 24px;
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        }
        .toolbar input[type="search"] {
            flex: 1 1 260px; min-width: 0; padding: 8px 12px; font: inherit;
            border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--surface); color: var(--text);
        }
        .chip {
            padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font: inherit; font-size: 0.85rem; cursor: pointer;
        }
        .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
        .result-count { color: var(--muted); font-size: 0.85rem; margin-left: auto; }

        /* Layout */
        .layout {
            max-width: 1280px; margin: 0 auto; padding: 20px 24px 64px;
            display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px;
        }
        nav { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; font-size: 0.88rem; }
        nav h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 6px; }
        nav ul { list-style: none; margin: 0; padding: 0; }
        nav li a { display: flex; gap: 8px; align-items: baseline; padding: 3px 6px; border-radius: 6px; color: var(--text); }
        nav li a:hover { background: var(--surface-alt); text-decoration: none; }
        nav li a .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        main { min-width: 0; }

        /* Groups and operations */
        .group { margin: 0 0 32px; }
        .group > h2 { margin: 0 0 4px; font-size: 1.25rem; }
        .group > p { margin: 0 0 12px; color: var(--muted); }
        .operation {
            margin: 0 0 10px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
        }
        .operation > summary {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            padding: 10px 14px; cursor: pointer; list-style: none;
        }
        .operation > summary::-webkit-details-marker { display: none; }
        .operation[open] > summary { border-bottom: 1px solid var(--border); }
        .operation .path { font-family: var(--mono); font-size: 0.92rem; word-break: break-all; }
        .operation .summary-text { color: var(--muted); flex: 1 1 200px; }
        .method {
            display: inline-block; min-width: 62px; text-align: center; padding: 2px 8px; border-radius: 5px;
            font: 600 0.75rem/1.6 var(--mono); color: #fff; background: var(--other);
        }
        .method.get { background: var(--get); }
        .method.post { background: var(--post); }
        .method.put { background: var(--put); }
        .method.patch { background: var(--patch); }
        .method.delete { background: var(--delete); }
        nav .method { min-width: 48px; font-size: 0.65rem; padding: 0 4px; }
        .badge {
            display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px;
            font-size: 0.75rem; border: 1px solid var(--border); white-space: nowrap;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .dot.high { background: var(--high); }
        .dot.medium { background: var(--medium); }
        .dot.low { background: var(--low); }
        .badge.write { border-color: var(--delete); color: var(--delete); }
        .badge.open { border-color: var(--warn-border); background: var(--warn-bg); }
        .operation-body { padding: 14px 16px 16px; }
        .operation-body h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 8px; }
        .operation-body h3:first-child { margin-top: 0; }
        .operation-body p { margin: 0 0 8px; }
        .open-points { margin: 0 0 4px; padding: 10px 14px 10px 32px; background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius); }
        .meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 0.88rem; }
        .meta dt { color: var(--muted); }
        .meta dd { margin: 0; word-break: break-all; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
        th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
        .required { color: var(--delete); font-size: 0.8rem; margin-left: 4px; }

        /* Schemas */
        .schema { font-family: var(--mono); font-size: 0.85rem; background: var(--code); border-radius: 6px; padding: 8px 12px; }
        .schema ul { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 1px dashed var(--border); }
        .schema > ul { padding-left: 0; border-left: none; }
        .schema li { margin: 2px 0; }
        .schema .name { color: var(--text); font-weight: 600; }
        .schema .type { color: var(--accent); }
        .hint { color: var(--muted); font-size: 0.85rem; }
        .response { margin: 0 0 10px; }
        .response .status { font-family: var(--mono); font-weight: 600; margin-right: 8px; }
        .empty { color: var(--muted); font-style: italic; }
        .hidden { display: none !important; }

        @media (max-width: 860px) {
            .layout { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 48px; }
            nav { display: none; }
            header { padding: 20px 16px 4px; }
            .toolbar-inner { padding: 10px 16px; }
            .result-count { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <header id="page-header"></header>
    <div class="toolbar">
        <div class="toolbar-inner">
            <input id="search" type="search" placeholder="Search path, summary or operationId" aria-label="Search operations">
            <button class="chip" type="button" data-filter="high" aria-pressed="false">High</button>
            <button class="chip" type="button" data-filter="medium" aria-pressed="false">Medium</button>
            <button class="chip" type="button" data-filter="low" aria-pressed="false">Low</button>
            <button class="chip" type="button" data-filter="write" aria-pressed="false">Write only</button>
            <button class="chip" type="button" data-filter="open" aria-pressed="false">Open points</button>
            <button class="chip" type="button" data-filter="derived" aria-pressed="false">Derived only</button>
            <span class="result-count" id="result-count"></span>
        </div>
    </div>
    <div class="layout">
        <nav id="page-nav" aria-label="Operations"></nav>
        <main id="page-main"></main>
    </div>

    <script type="application/json" id="unwire-spec">__UNWIRE_SPEC_JSON__</script>
    <script>
        // ===========================================================================
        // ===============================   HELPERS   ===============================
        // ===========================================================================
        //
        //   el                  Builds an element, text children always as text nodes.
        //   resolveRef          Resolves a local '#/...' $ref, null when missing.
        //   resolveDeep         Follows $refs until a real object is reached.
        //   refName             'Team' from '#/components/schemas/Team'.
        //   slug                Turns any text into an id-safe slug.
        //

        const HTTP_METHODS     = ['get', 'post', 'put', 'patch', 'delete', 'head', 'options', 'trace']
        const WRITE_METHODS    = ['post', 'put', 'patch', 'delete']
        const MAX_SCHEMA_DEPTH = 6

        function el(tag, attributes = {}, ...children) {
            const node = document.createElement(tag)
            for (const [key, value] of Object.entries(attributes)) {
                if (null == value || false === value) continue
                if (key === 'className') node.className = value
                else node.setAttribute(key, value === true ? '' : String(value))
            }
            // Render helpers return nested arrays (sections of lists), flattened completely.
            for (const child of children.flat(Infinity)) {
                if (null == child || false === child) continue
                node.append(child instanceof Node ? child : document.createTextNode(String(child)))
            }
            return node
        }

        function resolveRef(ref) {
            if (typeof ref !== 'string' || !ref.startsWith('#/')) return null
            // '#/components/schemas/Device~1List' => ['components', 'schemas', 'Device/List'] (RFC 6901)
            const segments = ref.slice(2).split('/').map(segment => decodeURIComponent(segment).replaceAll('~1', '/').replaceAll('~0', '~'))
            return segments.reduce((node, segment) => node?.[segment] ?? null, spec)
        }

        function resolveDeep(node) {
            const seen = new Set()
            while (null != node?.$ref && !seen.has(node.$ref)) {
                seen.add(node.$ref)
                node = resolveRef(node.$ref) ?? node
                if (seen.has(node?.$ref)) break
            }
            return node
        }

        function refName(ref) {
            return String(ref).split('/').pop()
        }

        function slug(text) {
            return String(text).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
        }

        // ===========================================================================
        // ==============================   LOAD SPEC   ==============================
        // ===========================================================================
        //
        //   1. Parse        Reads the spec from the embedded JSON block.
        //   2. Operations   Flattens paths into one list, grouped by tag.
        //

        // ---------------------------------------------------------------------------
        // Parse
        //   Reads the spec from the embedded JSON block.
        // ---------------------------------------------------------------------------

        const spec = JSON.parse(document.getElementById('unwire-spec').textContent)

        // ---------------------------------------------------------------------------
        // Operations
        //   Flattens paths into one list, grouped by tag.
        // ---------------------------------------------------------------------------

        // Group of an operation: its first tag, else the first path segment after '/api'.
        // - '/api/teams/{id}'   => 'teams'
        // - '/cgi-bin/status'   => 'cgi-bin'
        function groupOf(operation, path) {
            if (Array.isArray(operation.tags) && operation.tags.length > 0) return String(operation.tags[0])
            const segments = path.split('/').filter(segment => segment !== '' && segment !== 'api' && !segment.startsWith('{'))
            return segments[0] ?? 'default'
        }

        const operations = Object.entries(spec.paths ?? {})
            .flatMap(([path, pathItem]) => HTTP_METHODS
                .filter(method => null != pathItem?.[method])
                .map(method => {
                    const operation = pathItem[method]
                    const open      = Array.isArray(operation['x-unwire-open']) ? operation['x-unwire-open'] : []
                    return {
                        path,
                        method,
                        operation,
                        group:      groupOf(operation, path),
                        id:         `op-${slug(operation.operationId ?? `${method}-${path}`)}`,
                        confidence: operation['x-unwire-confidence'] ?? 'unknown',
                        isWrite:    operation['x-unwire-impact'] === 'write' || WRITE_METHODS.includes(method),
                        // 'discover:swagger.v1.json' => published by the target, anything else derived from code
                        isDocumented: String(operation['x-unwire-source'] ?? spec['x-unwire-source'] ?? '').startsWith('discover:'),
                        open,
                        parameters: [...(pathItem.parameters ?? []), ...(operation.parameters ?? [])].map(resolveDeep),
                    }
                }))

        const groupNames = [...new Set(operations.map(entry => entry.group))].sort((a, b) => a.localeCompare(b))
        const tagInfo    = new Map((spec.tags ?? []).map(tag => [String(tag.name), tag]))

        // ===========================================================================
        // ===========================   RENDER SCHEMAS   ============================
        // ===========================================================================
        //
        //   schemaType      Short type label: 'string (email)', 'Team[]', 'enum'.
        //   schemaNode      One property line with its nested properties.
        //   renderSchema    The schema block of a body or response.
        //

        function schemaType(schema) {
            if (null == schema) return 'any'
            if (null != schema.$ref) return refName(schema.$ref)
            if (schema.type === 'array') return `${schemaType(schema.items)}[]`
            const type = Array.isArray(schema.type) ? schema.type.join(' | ') : (schema.type ?? (schema.properties ? 'object' : 'any'))
            return null != schema.format ? `${type} (${schema.format})` : type
        }

        function schemaNode({ name, schema, isRequired, depth, seen }) {
            const resolved = resolveDeep(schema) ?? {}
            const line = el('li', {},
                null != name ? el('span', { className: 'name' }, name) : null,
                null != name ? ': ' : null,
                el('span', { className: 'type' }, schemaType(schema)),
                isRequired ? el('span', { className: 'required' }, 'required') : null,
                Array.isArray(resolved.enum) ? el('span', { className: 'hint' }, `  one of ${resolved.enum.map(value => JSON.stringify(value)).join(', ')}`) : null,
                null != resolved.default ? el('span', { className: 'hint' }, `  default ${JSON.stringify(resolved.default)}`) : null,
                null != resolved.description ? el('span', { className: 'hint' }, `  // ${resolved.description}`) : null,
            )

            // Nested properties: objects directly, arrays through their items, stops on cycles.
            const target = resolved.type === 'array' ? resolveDeep(resolved.items) : resolved
            const ref    = resolved.type === 'array' ? resolved.items?.$ref : schema?.$ref
            if (null == target?.properties || depth >= MAX_SCHEMA_DEPTH || (null != ref && seen.has(ref))) return line

            const nextSeen = new Set(seen)
            if (null != ref) nextSeen.add(ref)
            const required = new Set(target.required ?? [])
            line.append(el('ul', {}, Object.entries(target.properties)
                .map(([childName, childSchema]) => schemaNode({ name: childName, schema: childSchema, isRequired: required.has(childName), depth: depth + 1, seen: nextSeen }))))
            return line
        }

        function renderSchema(schema) {
            if (null == schema) return el('p', { className: 'empty' }, 'No schema.')
            return el('div', { className: 'schema' }, el('ul', {}, schemaNode({ name: null, schema, isRequired: false, depth: 0, seen: new Set() })))
        }

        // ===========================================================================
        // ==========================   RENDER OPERATIONS   ==========================
        // ===========================================================================
        //
        //   renderParameters    Table of path, query, header and cookie parameters.
        //   renderBody          Schemas of the request body per media type.
        //   renderResponses     One block per status code.
        //   renderOperation     The collapsible card of one operation.
        //

        function renderParameters(parameters) {
            if (parameters.length === 0) return null
            return [
                el('h3', {}, 'Parameters'),
                el('div', { className: 'table-wrap' }, el('table', {},
                    el('thead', {}, el('tr', {}, el('th', {}, 'Name'), el('th', {}, 'In'), el('th', {}, 'Type'), el('th', {}, 'Description'))),
                    el('tbody', {}, parameters.map(parameter => el('tr', {},
                        el('td', {}, el('code', {}, parameter?.name ?? '?'), parameter?.required ? el('span', { className: 'required' }, 'required') : null),
                        el('td', {}, parameter?.in ?? ''),
                        el('td', {}, el('code', {}, schemaType(parameter?.schema)),
                            Array.isArray(resolveDeep(parameter?.schema)?.enum) ? el('div', { className: 'hint' }, `one of ${resolveDeep(parameter.schema).enum.join(', ')}`) : null),
                        el('td', {}, parameter?.description ?? ''),
                    ))),
                )),
            ]
        }

        function renderContent(content) {
            const entries = Object.entries(content ?? {})
            if (entries.length === 0) return [el('p', { className: 'empty' }, 'No content.')]
            return entries.map(([mediaType, media]) => el('div', {}, el('div', { className: 'hint' }, mediaType), renderSchema(media?.schema)))
        }

        function renderBody(requestBody) {
            const body = resolveDeep(requestBody)
            if (null == body) return null
            return [el('h3', {}, body.required ? 'Request body (required)' : 'Request body'), body.description ? el('p', {}, body.description) : null, renderContent(body.content)]
        }

        function renderResponses(responses) {
            const entries = Object.entries(responses ?? {})
            if (entries.length === 0) return null
            return [el('h3', {}, 'Responses'), entries.map(([status, response]) => {
                const resolved = resolveDeep(response) ?? {}
                return el('div', { className: 'response' },
                    el('div', {}, el('span', { className: 'status' }, status), resolved.description ?? ''),
                    null != resolved.content ? renderContent(resolved.content) : null,
                )
            })]
        }

        function renderOperation(entry) {
            const { operation, method, path, confidence, isWrite, open } = entry
            const verified = operation['x-unwire-verified']

            const summary = el('summary', {},
                el('span', { className: `method ${method}` }, method.toUpperCase()),
                el('span', { className: 'path' }, path),
                el('span', { className: 'summary-text' }, operation.summary ?? ''),
                el('span', { className: 'badge', title: 'Confidence' }, el('span', { className: `dot ${confidence}` }), confidence),
                isWrite ? el('span', { className: 'badge write', title: 'Changes data on the target' }, 'write') : null,
                entry.isDocumented ? null : el('span', { className: 'badge', title: 'Derived from the frontend code, not documented by the target' }, 'derived'),
                open.length > 0 ? el('span', { className: 'badge open' }, `${open.length} open`) : null,
            )

            const body = el('div', { className: 'operation-body' },
                operation.description ? [el('h3', {}, 'Description'), el('p', {}, operation.description)] : null,
                open.length > 0 ? [el('h3', {}, 'Open points'), el('ul', { className: 'open-points' }, open.map(point => el('li', {}, point)))] : null,
                renderParameters(entry.parameters),
                renderBody(operation.requestBody),
                renderResponses(operation.responses),
                el('h3', {}, 'Source'),
                el('dl', { className: 'meta' },
                    el('dt', {}, 'operationId'), el('dd', {}, el('code', {}, operation.operationId ?? '-')),
                    el('dt', {}, 'Found in'), el('dd', {}, el('code', {}, operation['x-unwire-source'] ?? '-')),
                    el('dt', {}, 'Verified'), el('dd', {}, verified === true ? 'yes, executed against the target' : 'no, derived statically'),
                    el('dt', {}, 'Link'), el('dd', {}, el('a', { href: `#${entry.id}` }, `#${entry.id}`)),
                ),
            )

            const card = el('details', { className: 'operation', id: entry.id }, summary, body)
            entry.card = card
            return card
        }

        // ===========================================================================
        // =============================   RENDER PAGE   =============================
        // ===========================================================================
        //
        //   1. Header        Title, version, description, notice and stats.
        //   2. Navigation    Groups with their operations as links.
        //   3. Groups        One section per group with its operation cards.
        //   4. Open points   The open points of the whole spec, from root x-unwire-open.
        //

        // ---------------------------------------------------------------------------
        // Header
        //   Title, version, description, notice and stats.
        // ---------------------------------------------------------------------------

        const countBy         = predicate => operations.filter(predicate).length
        const rootOpen        = Array.isArray(spec['x-unwire-open']) ? spec['x-unwire-open'] : []
        const openTotal       = operations.reduce((sum, entry) => sum + entry.open.length, 0) + rootOpen.length
        const documentedCount = countBy(entry => entry.isDocumented)
        const derivedCount    = operations.length - documentedCount

        // Where the operations come from decides what the notice may claim.
        // - only documented  => taken from the target's own documentation
        // - only derived     => derived from the frontend code
        // - both             => one sentence per source with its count
        const notice = documentedCount > 0 && derivedCount > 0
            ? `${documentedCount} operations come from documentation the target publishes, ${derivedCount} were derived statically from its frontend code. Nothing was executed against the target.`
            : documentedCount > 0
                ? 'Taken from documentation the target publishes. Nothing was executed against the target.'
                : 'Derived statically by Unwire from the frontend code. Nothing was executed against the target, every operation is a well-founded guess.'

        document.getElementById('page-header').append(
            el('h1', {}, spec.info?.title ?? 'API'),
            el('div', { className: 'version' }, `Version ${spec.info?.version ?? '?'} · OpenAPI ${spec.openapi ?? '?'}`),
            spec.info?.description ? el('p', { className: 'description' }, spec.info.description) : null,
            countBy(entry => entry.operation['x-unwire-verified'] !== true) > 0 ? el('div', { className: 'notice' }, notice) : null,
            el('div', { className: 'stats' },
                el('span', { className: 'stat' }, el('strong', {}, operations.length), ' operations'),
                el('span', { className: 'stat' }, el('span', { className: 'dot high' }), ' ', el('strong', {}, countBy(entry => entry.confidence === 'high')), ' high'),
                el('span', { className: 'stat' }, el('span', { className: 'dot medium' }), ' ', el('strong', {}, countBy(entry => entry.confidence === 'medium')), ' medium'),
                el('span', { className: 'stat' }, el('span', { className: 'dot low' }), ' ', el('strong', {}, countBy(entry => entry.confidence === 'low')), ' low'),
                el('span', { className: 'stat' }, el('strong', {}, countBy(entry => entry.isWrite)), ' write'),
                documentedCount > 0 && derivedCount > 0 ? el('span', { className: 'stat' }, el('strong', {}, derivedCount), ' derived') : null,
                openTotal > 0 ? el('a', { className: 'stat', href: '#open-points' }, el('strong', {}, openTotal), ' open points') : null,
            ),
        )

        // ---------------------------------------------------------------------------
        // Navigation
        //   Groups with their operations as links.
        // ---------------------------------------------------------------------------

        const nav = document.getElementById('page-nav')
        for (const group of groupNames) {
            const items = operations
                .filter(entry => entry.group === group)
                .map(entry => {
                    entry.navItem = el('li', {}, el('a', { href: `#${entry.id}`, title: `${entry.method.toUpperCase()} ${entry.path}` },
                        el('span', { className: `method ${entry.method}` }, entry.method.toUpperCase()),
                        el('span', { className: 'path' }, entry.path)))
                    return entry.navItem
                })
            nav.append(el('div', { 'data-group': group }, el('h2', {}, group), el('ul', {}, items)))
        }
        if (openTotal > 0) nav.append(el('h2', {}, el('a', { href: '#open-points' }, 'Open points')))

        // ---------------------------------------------------------------------------
        // Groups
        //   One section per group with its operation cards.
        // ---------------------------------------------------------------------------

        const main = document.getElementById('page-main')
        if (operations.length === 0) main.append(el('p', { className: 'empty' }, 'The spec has no operations.'))
        for (const group of groupNames) {
            main.append(el('section', { className: 'group', 'data-group': group, id: `group-${slug(group)}` },
                el('h2', {}, group),
                tagInfo.get(group)?.description ? el('p', {}, tagInfo.get(group).description) : null,
                operations.filter(entry => entry.group === group).map(renderOperation),
            ))
        }

        // ---------------------------------------------------------------------------
        // Open points
        //   The open points of the whole spec, from root x-unwire-open.
        // ---------------------------------------------------------------------------

        if (openTotal > 0) {
            main.append(el('section', { className: 'group', id: 'open-points' },
                el('h2', {}, 'Open points'),
                el('p', {}, 'Everything that could not be resolved from the code alone.'),
                rootOpen.length > 0 ? el('ul', { className: 'open-points' }, rootOpen.map(point => el('li', {}, point))) : null,
                el('div', { className: 'table-wrap' }, el('table', {},
                    el('tbody', {}, operations
                        .filter(entry => entry.open.length > 0)
                        .flatMap(entry => entry.open.map(point => el('tr', {},
                            el('td', {}, el('a', { href: `#${entry.id}` }, el('span', { className: `method ${entry.method}` }, entry.method.toUpperCase()), ' ', el('code', {}, entry.path))),
                            el('td', {}, point),
                        )))),
                )),
            ))
        }

        // ===========================================================================
        // ==========================   FILTER OPERATIONS   ==========================
        // ===========================================================================
        //
        //   1. Filters    Search text and chips, combined with AND.
        //   2. Deep link  Opens the card of the operation in the URL hash.
        //

        // ---------------------------------------------------------------------------
        // Filters
        //   Search text and chips, combined with AND.
        // ---------------------------------------------------------------------------

        /*
            > Search text      -> method, path, summary or operationId contains it
            > Confidence chips -> any pressed confidence matches (OR between them)
            > Write only       -> only write operations
            > Open points      -> only operations with open points
            > Derived only     -> only operations not documented by the target
            Groups and nav headings without a visible operation are hidden too.
        */

        const searchInput = document.getElementById('search')
        const chips       = [...document.querySelectorAll('.chip')]
        const resultCount = document.getElementById('result-count')

        function applyFilters() {
            const text        = searchInput.value.trim().toLowerCase()
            const pressed     = new Set(chips.filter(chip => chip.getAttribute('aria-pressed') === 'true').map(chip => chip.dataset.filter))
            const confidences = ['high', 'medium', 'low'].filter(value => pressed.has(value))

            let visibleCount = 0
            for (const entry of operations) {
                const haystack = `${entry.method} ${entry.path} ${entry.operation.summary ?? ''} ${entry.operation.operationId ?? ''}`.toLowerCase()
                const isVisible = (text === '' || haystack.includes(text))
                    && (confidences.length === 0 || confidences.includes(entry.confidence))
                    && (!pressed.has('write') || entry.isWrite)
                    && (!pressed.has('open') || entry.open.length > 0)
                    && (!pressed.has('derived') || !entry.isDocumented)
                entry.card.classList.toggle('hidden', !isVisible)
                entry.navItem.classList.toggle('hidden', !isVisible)
                if (isVisible) visibleCount++
            }

            // Direct children only: lists inside a card (schemas, open points) are no operations.
            for (const container of document.querySelectorAll('[data-group]')) {
                container.classList.toggle('hidden', null == container.querySelector(':scope > .operation:not(.hidden), :scope > ul > li:not(.hidden)'))
            }
            resultCount.textContent = `${visibleCount} of ${operations.length} operations`
        }

        searchInput.addEventListener('input', applyFilters)
        for (const chip of chips) {
            chip.addEventListener('click', () => {
                chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true')
                applyFilters()
            })
        }
        applyFilters()

        // ---------------------------------------------------------------------------
        // Deep link
        //   Opens the card of the operation in the URL hash.
        // ---------------------------------------------------------------------------

        function openFromHash() {
            const target = document.getElementById(decodeURIComponent(location.hash.slice(1)))
            if (target?.tagName === 'DETAILS') {
                target.open = true
                target.scrollIntoView({ block: 'start' })
            }
        }
        window.addEventListener('hashchange', openFromHash)
        openFromHash()
    </script>
</body>
</html>
