# ---------------------------------------------------------------------------
# Unwire testbed
#   Local targets Unwire may hit without any risk: throwaway containers on
#   127.0.0.1 only, no volumes, 'docker compose down' resets everything.
#
#   Copy-Item .env.example .env
#   docker compose up -d --build
#   docker compose down                       # back to a fresh state
# ---------------------------------------------------------------------------

#
#   Chapters:
#     WEB SHOP        OWASP Juice Shop.
#     ROUTER LOGINS   Mock router, one port per login method.
#

services:

  # ===========================================================================
  # ==============================   WEB SHOP   ===============================
  # ===========================================================================
  #
  #   Juice Shop Service   Insecure shop made to be attacked, Angular SPA.
  #

  # ---------------------------------------------------------------------------
  # Juice Shop Service
  #   OWASP's intentionally insecure shop: REST API, login, admin area.
  # ---------------------------------------------------------------------------
  unwire-juiceshop:
    container_name: unwire-juiceshop
    restart: "no"   # a testbed should not come back after a reboot
    image: bkimminich/juice-shop:v17.1.1

    ports:
      - "127.0.0.1:3000:3000"   # Juice Shop UI and API, this machine only

  # ===========================================================================
  # ============================   ROUTER LOGINS   ============================
  # ===========================================================================
  #
  #   Mock Router Service   One frame UI, one port per login method.
  #

  # ---------------------------------------------------------------------------
  # Mock Router Service
  #   Rebuilds the traps of real routers, see mock-router/README.md.
  # ---------------------------------------------------------------------------
  unwire-mock-router:
    container_name: unwire-mock-router
    restart: "no"   # a testbed should not come back after a reboot
    build:
      context: ./mock-router
      dockerfile: Dockerfile
    image: unwire-mock-router:latest
    pull_policy: build

    ports:
      - "127.0.0.1:3010:3010"   # no login, Referer check on scripts, this machine only
      - "127.0.0.1:3011:3011"   # HTTP Basic
      - "127.0.0.1:3012:3012"   # HTTP Digest
      - "127.0.0.1:3013:3013"   # login form with session cookie
      - "127.0.0.1:3014:3014"   # session in the URL parameter sid
      - "127.0.0.1:3015:3015"   # session token in the path
      - "127.0.0.1:3016:3016"   # Bearer header for the API

    environment:
      # Test login and session from .env, startup aborts with the message when it is missing
      MOCK_ROUTER_USER: ${MOCK_ROUTER_USER:?Set MOCK_ROUTER_USER in .env, see .env.example}
      MOCK_ROUTER_PASSWORD: ${MOCK_ROUTER_PASSWORD:?Set MOCK_ROUTER_PASSWORD in .env, see .env.example}
      MOCK_ROUTER_SESSION: ${MOCK_ROUTER_SESSION:?Set MOCK_ROUTER_SESSION in .env, see .env.example}
