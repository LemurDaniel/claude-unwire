<!--
    NOTE:
      Template of the clickable API documentation, filled by ../scripts/ConvertTo-UnwireHtml.ps1:
      the TITLE placeholder in <title> becomes the HTML-escaped info.title, the SPEC_JSON
      placeholder in the JSON script block the spec, the FAVICON placeholder in the icon link
      the plugin icon (assets/icon.svg) as base64. They appear nowhere else.
      Self-contained: no CDN, no network, opens offline from the file system.

      Every value of the spec is untrusted (it comes from downloaded code), so the page only
      ever writes it with textContent, never as HTML.

      Chapters (script):
        HELPERS             DOM builder, $ref resolution and small formatters.
        LOAD SPEC           Parses the embedded spec and flattens the operations.
        RENDER SCHEMAS      Turns a JSON schema into a nested property list.
        BUILD COMMANDS      'Try it': PowerShell and cURL commands, a GET link, the page sends nothing.
        RENDER OPERATIONS   One collapsible card per operation.
        RENDER PAGE         Header, stats, navigation, groups and open points.
        FILTER OPERATIONS   Search, filter chips and group tabs.
-->

    <style>
        :root {
            --bg: #f7f7f5;
            --surface: #ffffff;

        }
        /* Light is the default, dark only by the toggle in the header (data-theme on <html>) */
        :root[data-theme="dark"] {
            --bg: #161615;
            --surface: #1f1f1d;
            --surface-alt: #262624;
            --text: #ecebe6;
            --muted: #9d9b94;
            --border: #34332f;
            --accent: #91a7ff;
            --get: #69db7c;
            --post: #74c0fc;
            --put: #ffc078;
            --patch: #e599f7;
            --delete: #ff8787;
            --other: #adb5bd;
            --high: #69db7c;
            --medium: #ffc078;
            --low: #ff8787;
            --warn-bg: #2b2118;
            --warn-border: #8a5a24;
            --code: #2a2a27;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        /* --toolbar-h is measured by the page script, the sticky toolbar has one or two rows */
        :root { --toolbar-h: 116px; color-scheme: light; }
        html { scroll-padding-top: calc(var(--toolbar-h) + 12px); }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        code, .mono { font-family: var(--mono); font-size: 0.9em; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header and toolbar */
        header { position: relative; padding: 28px 24px 8px; max-width: 1280px; margin: 0 auto; }
        .theme-toggle {
            position: absolute; top: 28px; right: 24px; padding: 6px 12px;
            border: none; border-left: 2px solid var(--border); border-radius: 0;
            background: var(--surface); color: var(--text); font: inherit; font-size: 0.82rem; cursor: pointer;
        }
        .theme-toggle:hover { background: var(--surface-alt); border-left-color: var(--accent); }
        .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        header h1 { margin: 0 0 4px; padding-right: 110px; font-size: 1.7rem; letter-spacing: -0.01em; }
        header .version { color: var(--muted); font-size: 0.9rem; }
        header .description { margin: 10px 0 0; max-width: 820px; color: var(--muted); }
        .notice {
            margin: 16px 0 0; padding: 8px 14px; border-radius: var(--radius);
            background: var(--warn-bg); border: 1px solid var(--warn-border); font-size: 0.88rem;
        }
        /* Flex, not grid: the wide Confidence card never pushes the last card into a row of its own */
        .summary { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 16px; }
        .card {
            flex: 1 1 160px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface);
            border: 1px solid var(--border); min-width: 0;
        }
        .card.wide { flex: 2 1 280px; }
        .card-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
        .card-value { display: block; margin: 2px 0; font-size: 1.6rem; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--text); }
        .card-sub { font-size: 0.82rem; color: var(--muted); }
        a.card:hover { border-color: var(--accent); text-decoration: none; }
        a.card .card-value { color: var(--accent); }
        .bar { display: flex; height: 8px; margin: 8px 0 10px; border-radius: 999px; overflow: hidden; background: var(--surface-alt); }
        .bar span { display: block; }
        .bar .high { background: var(--high); }
        .bar .medium { background: var(--medium); }
        .bar .low { background: var(--low); }
        .levels { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.88rem; }
        .levels > span { display: inline-flex; align-items: center; gap: 6px; }
        .levels strong { font-variant-numeric: tabular-nums; }
        /* Info tooltip: opens on hover and on focus (keyboard, tap), takes no space in the card */
        .info { position: relative; display: inline-block; margin-left: 4px; cursor: help; text-transform: none; letter-spacing: 0; }
        .info-box {
            display: none; position: absolute; top: calc(100% + 6px); left: -12px; z-index: 10;
            width: max-content; max-width: min(340px, calc(100vw - 32px)); padding: 10px 12px;
            background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: 0 6px 20px rgb(0 0 0 / 0.25); color: var(--text); font-size: 0.82rem;
        }
        .info:hover .info-box, .info:focus .info-box, .info:focus-within .info-box { display: block; }
        .info-box ul { margin: 0 0 6px; padding: 0; list-style: none; }
        .info-box li { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        .info-box p { margin: 0; color: var(--muted); }
        .toolbar {
            position: sticky; top: 0; z-index: 5; background: var(--bg);
            border-bottom: 1px solid var(--border);
        }
        .toolbar-inner {
            max-width: 1280px; margin: 0 auto; padding: 12px 24px;
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        }
        .toolbar input[type="search"] {
            flex: 1 1 260px; min-width: 0; padding: 8px 12px; font: inherit;
            border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--surface); color: var(--text);
        }
        .chip {
            padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font: inherit; font-size: 0.85rem; cursor: pointer;
        }
        .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
        /* Fixed width: '4 of 89' and '89 of 89' wrap the toolbar the same way, the tiles never shift */
        .result-count { flex: none; min-width: 13em; text-align: right; color: var(--muted); font-size: 0.85rem; margin-left: auto; }
        /* Group tabs: square tiles in a grid that wraps, a thin accent bar marks the active one */
        .group-bar {
            max-width: 1280px; margin: 0 auto; padding: 0 24px 12px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px;
        }
        .group-tab {
            display: flex; align-items: baseline; gap: 8px; min-width: 0;
            padding: 7px 12px; border: none; border-left: 2px solid transparent; border-radius: 0;
            background: var(--surface); color: var(--text); font: inherit; font-size: 0.82rem; font-weight: 500;
            text-align: left; cursor: pointer; transition: background 0.12s, border-color 0.12s, color 0.12s;
        }
        .group-tab .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .group-tab .prefix { color: var(--muted); font-weight: 400; }
        .group-tab .n { flex: none; color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
        .group-tab:hover { background: var(--surface-alt); border-left-color: var(--border); }
        .group-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .group-tab[aria-pressed="true"] {
            background: color-mix(in srgb, var(--accent) 16%, var(--surface));
            border-left-color: var(--accent); color: var(--accent);
        }
        .group-tab[aria-pressed="true"] .prefix, .group-tab[aria-pressed="true"] .n { color: var(--accent); opacity: 0.75; }

        /* Views: Operations, Open points and Authentication, switched by the tabs below the header */
        .views {
            max-width: 1280px; margin: 8px auto 0; padding: 0 24px;

                const value  = `${valuePrefixOf(scheme)}${trySettings.secrets[name] || `<${name}>`}`
                const field  = fields.find(([key]) => key === scheme.name)
                if (scheme['x-unwire-in'] === 'path') pathTokens.push([scheme, `${scheme.name ?? name}=${value}`])
                else if (scheme.type === 'apiKey' && scheme.in === 'header') headers[scheme.name] = value
                else if (scheme.type === 'apiKey' && scheme.in === 'query' && null != field) { if (field[1] === '') field[1] = value }
                else if (scheme.type === 'apiKey' && scheme.in === 'query') query.push([scheme.name, value])
                else if (scheme.type === 'apiKey' && scheme.in === 'cookie') headers.Cookie = [headers.Cookie, `${cookieNameOf(name, scheme)}=${value}`].filter(Boolean).join('; ')
                else headers.Authorization = value
            }

            let path = entry.path
            for (const parameter of entry.parameters) {
                const value = values[`${parameter?.in}:${parameter?.name}`] ?? ''
                if (value === '') continue
                if (parameter.in === 'path') path = path.replaceAll(`{${parameter.name}}`, encodeURIComponent(value))
                else if (parameter.in === 'query') query.push([parameter.name, value])
                else if (parameter.in === 'header') headers[parameter.name] = value
                else if (parameter.in === 'cookie') headers.Cookie = [headers.Cookie, `${parameter.name}=${value}`].filter(Boolean).join('; ')
            }

            const search = query.map(([name, value]) => `${encodeURIComponent(name)}=${encodeURIComponent(value)}`).join('&')
            const body   = isForm
                ? fields.map(([name, value]) => `${encodeURIComponent(name)}=${encodeURIComponent(value)}`).join('&')
                : bodyText.trim()
            const url    = pathTokens.reduce((current, [scheme, token]) => addPathToken(current, scheme, token), `${trySettings.baseUrl}${path}${search ? `?${search}` : ''}`)
            return {
                method:      entry.method.toUpperCase(),
                url,
                headers,
                contentType: null != mediaType && body !== '' ? mediaType : null,
                body:        body !== '' ? body : null,
            }
        }

        function renderCommands(request) {
            const method     = request.method.charAt(0) + request.method.slice(1).toLowerCase()
            const headerList = Object.entries(request.headers)
            const pwshLines  = [
                `Uri                  = ${quotePwsh(request.url)}`,
                `Method               = ${quotePwsh(method)}`,
                headerList.length > 0 ? `Headers              = @{ ${headerList.map(([name, value]) => `${quotePwsh(name)} = ${quotePwsh(value)}`).join('; ')} }` : null,
                null != request.contentType ? `ContentType          = ${quotePwsh(request.contentType)}` : null,
                null != request.body ? `Body                 = ${quotePwsh(request.body)}` : null,
                trySettings.skipCertificate ? 'SkipCertificateCheck = $true' : null,
                'SkipHttpErrorCheck   = $true',
            ].filter(Boolean)
            const pwsh = ['$request = @{', ...pwshLines.map(line => `    ${line}`), '}', '$response = Invoke-WebRequest @request', '$response.StatusCode', '$response.Content'].join('\n')

            const curl = [
                `curl -i -X ${request.method} ${quoteBash(request.url)}`,
                ...headerList.map(([name, value]) => `  -H ${quoteBash(`${name}: ${value}`)}`),
                null != request.contentType ? `  -H ${quoteBash(`Content-Type: ${request.contentType}`)}` : null,
                null != request.body ? `  --data-raw ${quoteBash(request.body)}` : null,
                trySettings.skipCertificate ? '  -k' : null,
            ].filter(Boolean).join(' \\\n')

            // Copy: clipboard API where allowed, else the text is selected for Ctrl+C.
            const command = (label, text) => {
                const pre    = el('pre', {}, text)
                const button = el('button', { type: 'button' }, 'Copy')
                button.addEventListener('click', () => {
                    const select = () => window.getSelection()?.selectAllChildren(pre)
                    if (null == navigator.clipboard) return select()
                    navigator.clipboard.writeText(text).then(() => { button.textContent = 'Copied' }, select)
                })
                return el('div', { className: 'command' }, el('div', { className: 'hint' }, label), button, pre)
            }
            return [command('PowerShell 7', pwsh), command('cURL (bash)', curl)]
        }

        /*
            'Open in browser' for a GET that changes nothing: a plain link the user clicks, the
            page itself still sends nothing.
            > no GET, or a write operation          -> nothing
            > no absolute http(s) URL               -> hint to set the base URL
            > placeholders left ('{id}', '<sid>')   -> hint to fill them in
            > a header other than Basic or Cookie   -> hint: a link cannot send headers
            > otherwise                             -> link in a new tab: the browser adds its
                                                       own cookie of the target, or asks for Basic
            Only http(s) URLs become a link: the base URL may come from the untrusted spec.
        */
        function renderBrowserLink(entry, request) {
            if (request.method !== 'GET' || entry.isWrite) return null
            const LABEL    = 'Open in browser ↗'
            // The button is always there: greyed out with the reason while it cannot work.
            const disabled = reason => el('div', { className: 'browser-link' },
                el('button', { type: 'button', disabled: true }, LABEL),
                el('span', { className: 'hint' }, reason))
            if (!/^https?:\/\//i.test(request.url)) return disabled('Set an absolute base URL first, in "Try it: base URL and session" at the top, e.g. http://192.168.178.1.')
            if (/[{}<>]/.test(request.url)) return disabled('Fill in the path parameters and the session values of the URL first.')
            const headerNames = Object.entries(request.headers)
                .filter(([name, value]) => name.toLowerCase() !== 'cookie' && !(name.toLowerCase() === 'authorization' && value.startsWith('Basic ')))
                .map(([name]) => name)
            if (headerNames.length > 0) return disabled(`Not possible: the request needs the header ${headerNames.join(', ')}, a link cannot send headers. Use a command below.`)
            return el('div', { className: 'browser-link' },
                el('a', { href: request.url, target: '_blank', rel: 'noopener', className: 'button' }, LABEL),
                el('span', { className: 'hint' }, 'Opens the GET as a page in a new tab: the browser sends its own cookie of the target, or asks for Basic itself. A session in the URL lands in the browser history.'))
        }

        function renderTry(entry) {
            const values  = {}
            const output  = el('div', {})
            const content = Object.entries(resolveDeep(entry.operation.requestBody)?.content ?? {})
            const [mediaType, media] = content[0] ?? [null, null]
            // Body variants: the alternatives of a oneOf, else the schema itself
            const schema   = resolveDeep(media?.schema)
            const variants = Array.isArray(schema?.oneOf) ? schema.oneOf.map(resolveDeep) : (null != schema ? [schema] : [])

            let isConfirmed = !entry.isWrite
            const bodyInput = el('textarea', { spellcheck: 'false', 'aria-label': 'Request body' })
            bodyInput.value = variants.length > 0 ? bodySkeleton(mediaType, variants[0]) : ''

            const update = () => {
                const request = isConfirmed ? buildRequest(entry, values, mediaType, bodyInput.value) : null
                output.replaceChildren(...(isConfirmed
                    ? [renderBrowserLink(entry, request), ...renderCommands(request)].filter(Boolean)
                    : [el('p', { className: 'hint' }, 'Confirm the warning above to build the command.')]))
            }

            const fields = el('div', { className: 'try-fields' }, entry.parameters.map(parameter => {
                const input = el('input', { type: 'text', placeholder: resolveDeep(parameter?.schema)?.enum?.join(' | ') ?? parameter?.example ?? '' })
                input.addEventListener('input', () => { values[`${parameter?.in}:${parameter?.name}`] = input.value; update() })
                return [el('label', {}, `${parameter?.name ?? '?'} (${parameter?.in ?? '?'})`), input]
            }))
            bodyInput.addEventListener('input', update)

            let variantSelect = null
            if (variants.length > 1) {
                variantSelect = el('select', { 'aria-label': 'Body variant' }, variants.map((variant, index) => el('option', { value: index }, variant?.title ?? `Variant ${index + 1}`)))
                variantSelect.addEventListener('change', () => { bodyInput.value = bodySkeleton(mediaType, variants[Number(variantSelect.value)]); update() })
            }

            let warning = null
            if (entry.isWrite) {
                const confirm = el('input', { type: 'checkbox' })
                confirm.addEventListener('change', () => { isConfirmed = confirm.checked; update() })
                warning = el('div', { className: 'warn' },
                    'This operation changes data on the target. Run the command only against your own device and only when you know what it does.',
                    el('label', {}, confirm, ' I understand, build the command'))
            }

            document.addEventListener(SETTINGS_EVENT, update)
            update()
            return el('div', { className: 'try' },
                el('h3', {}, 'Try it'),
                el('p', { className: 'hint' }, 'Builds a command for your own terminal. This page sends nothing, session values stay in this tab.'),
                el('details', { className: 'why-no-send' },
                    el('summary', {}, 'Why no Send button?'),
                    el('p', { className: 'hint' }, 'This page is a local file (or comes from another origin than the device). The browser blocks it from reading the answers of the device (CORS, same-origin policy) and does not send the cookie of the device along with a request from here. A Send button would fail on almost every device, or change data without showing the answer. A GET can still be opened as a normal page with the link, everything else runs as a command.')),
                warning,
                entry.parameters.length > 0 ? fields : null,
                null != mediaType ? [el('div', { className: 'hint' }, `Body (${mediaType}${mediaType === 'application/x-www-form-urlencoded' ? ', one name=value per line' : ''})`), variantSelect, bodyInput] : null,
                output,
            )
        }

        function renderTrySettings() {
            const notify = () => document.dispatchEvent(new CustomEvent(SETTINGS_EVENT))
            const field  = (label, input, hint) => [el('label', {}, label), input, hint ? el('div', { className: 'hint' }, hint) : null]

            const baseUrl = el('input', { type: 'text', value: trySettings.baseUrl, 'aria-label': 'Base URL' })
            baseUrl.addEventListener('input', () => { trySettings.baseUrl = baseUrl.value.replace(/\/$/, ''); notify() })

            const skip = el('input', { type: 'checkbox' })
            skip.addEventListener('change', () => { trySettings.skipCertificate = skip.checked; notify() })

            /*
                One field per scheme:
                > http basic         -> user and password, encoded here: 'Basic ' [ admin ] : [ *** ]
                > apiKey in cookie   -> editable name, '=', value: [ session ] = [ abc ]
                > with a prefix      -> the prefix fixed in front: 'Bearer ' [ abc ]
                > anything else      -> the value alone
            */
            const schemes = Object.entries(spec.components?.securitySchemes ?? {}).map(([name, scheme]) => {
                const resolved = resolveDeep(scheme) ?? {}
                const prefix   = valuePrefixOf(resolved)
                const input    = el('input', { type: 'password', autocomplete: 'off', 'aria-label': name })
                input.addEventListener('input', () => { trySettings.secrets[name] = input.value; notify() })
                const pathHint = resolved['x-unwire-in'] === 'path' ? `Goes into the URL path: ${resolved['x-unwire-path-prefix'] ?? '…'};${resolved.name ?? name}=<value>${resolved['x-unwire-path-prefix'] ? '/…' : ''}, also in the browser link.` : ''
                const hint     = [resolved.description, pathHint].filter(Boolean).join(' ')

                if (prefix === 'Basic ') {
                    const user = el('input', { type: 'text', className: 'basic-user', autocomplete: 'off', spellcheck: 'false', placeholder: 'user', 'aria-label': `${name} user` })
                    input.placeholder = 'password'
                    // The secret is base64 of 'user:password', empty while both fields are empty.
                    const encode = () => {
                        trySettings.secrets[name] = user.value !== '' || input.value !== '' ? toBase64(`${user.value}:${input.value}`) : ''
                        notify()
                    }
                    user.addEventListener('input', encode)
                    input.addEventListener('input', encode)
                    const basicHint = [hint, 'Encoded to base64 in this tab, the command carries it.'].filter(Boolean).join(' ')
                    return field(name, el('div', { className: 'prefixed' }, el('code', {}, prefix), user, el('code', {}, ':'), input), basicHint)
                }

                if (resolved.type === 'apiKey' && resolved.in === 'cookie') {
                    const cookieName = el('input', { type: 'text', className: 'cookie-name', value: cookieNameOf(name, resolved), spellcheck: 'false', 'aria-label': `${name} cookie name` })
                    cookieName.addEventListener('input', () => { trySettings.cookieNames[name] = cookieName.value; notify() })
                    const cookieHint = [hint, 'Cookie name editable: take it from the cURL of your browser.'].filter(Boolean).join(' ')
                    return field(name, el('div', { className: 'prefixed' }, cookieName, el('code', {}, `=${prefix}`), input), cookieHint)
                }
                return field(name, prefix !== '' ? el('div', { className: 'prefixed' }, el('code', {}, prefix), input) : input, hint || null)
            })

            return el('details', { className: 'try-settings' },
                el('summary', {}, 'Try it: base URL and session'),
                el('div', { className: 'try-fields' },
                    field('Base URL', baseUrl),
                    field('Skip certificate check', el('div', {}, skip), 'For devices with a self-signed certificate.'),
                    schemes,
                    el('div', { className: 'hint' }, 'Session values stay in this tab only: never saved, gone on reload. Every operation card gets a "Try it" block that builds the command.'),
                ),
            )
        }

        // ===========================================================================
        // ==========================   RENDER OPERATIONS   ==========================
        // ===========================================================================
        //
        //   renderParameters    Table of path, query, header and cookie parameters.
        //   renderBody          Schemas of the request body per media type.
        //   renderResponses     One block per status code.
        //   renderOperation     The collapsible card of one operation.
        //

        function renderParameters(parameters) {
            if (parameters.length === 0) return null
            return [
                el('h3', {}, 'Parameters'),
                el('div', { className: 'table-wrap' }, el('table', {},
                    el('thead', {}, el('tr', {}, el('th', {}, 'Name'), el('th', {}, 'In'), el('th', {}, 'Type'), el('th', {}, 'Description'))),
                    el('tbody', {}, parameters.map(parameter => el('tr', {},
                        el('td', {}, el('code', {}, parameter?.name ?? '?'), parameter?.required ? el('span', { className: 'required' }, 'required') : null),
                        el('td', {}, parameter?.in ?? ''),
                        el('td', {}, el('code', {}, schemaType(parameter?.schema)),
                            Array.isArray(resolveDeep(parameter?.schema)?.enum) ? el('div', { className: 'hint' }, `one of ${resolveDeep(parameter.schema).enum.join(', ')}`) : null),
                        el('td', {}, parameter?.description ?? ''),
                    ))),
                )),
            ]
        }

        function renderContent(content) {
            const entries = Object.entries(content ?? {})
            if (entries.length === 0) return [el('p', { className: 'empty' }, 'No content.')]
            return entries.map(([mediaType, media]) => el('div', {}, el('div', { className: 'hint' }, mediaType), renderSchema(media?.schema)))
        }

        function renderBody(requestBody) {
            const body = resolveDeep(requestBody)
            if (null == body) return null
            return [el('h3', {}, body.required ? 'Request body (required)' : 'Request body'), body.description ? el('p', {}, body.description) : null, renderContent(body.content)]
        }

        function renderResponses(responses) {
            const entries = Object.entries(responses ?? {})
            if (entries.length === 0) return null
            return [el('h3', {}, 'Responses'), entries.map(([status, response]) => {
                const resolved = resolveDeep(response) ?? {}
                return el('div', { className: 'response' },
                    el('div', {}, el('span', { className: 'status' }, status), resolved.description ?? ''),
                    null != resolved.content ? renderContent(resolved.content) : null,
                )
            })]
        }

        function renderOperation(entry) {
            const { operation, method, path, confidence, isWrite, open } = entry
            const verified = operation['x-unwire-verified']

            const summary = el('summary', {},
                el('span', { className: `method ${method}` }, method.toUpperCase()),
                el('span', { className: 'path' }, path),
                el('span', { className: 'summary-text' }, operation.summary ?? ''),
                el('span', { className: 'badge', title: `Confidence: ${CONFIDENCE_HINTS[confidence] ?? 'not set in the spec'}` }, el('span', { className: `dot ${confidence}` }), confidence),
                isWrite ? el('span', { className: 'badge write', title: 'Changes data on the target' }, 'write') : null,
                entry.isDocumented ? null : el('span', { className: 'badge', title: 'Derived from the frontend code, not documented by the target' }, 'derived'),
                open.length > 0 ? el('span', { className: 'badge open' }, `${open.length} open`) : null,
            )

            const body = el('div', { className: 'operation-body' },
                operation.description ? [el('h3', {}, 'Description'), el('p', {}, operation.description)] : null,
                open.length > 0 ? [el('h3', {}, 'Open points'), el('ul', { className: 'open-points' }, open.map(point => el('li', {}, point)))] : null,
                renderParameters(entry.parameters),
                renderBody(operation.requestBody),
                renderResponses(operation.responses),
                el('h3', {}, 'Source'),
                el('dl', { className: 'meta' },
                    el('dt', {}, 'operationId'), el('dd', {}, el('code', {}, operation.operationId ?? '-')),
                    el('dt', {}, 'Auth'), el('dd', {}, entry.auth.label,
                        entry.auth.source === 'default' ? el('span', { className: 'hint' }, ' (spec default, not set on this operation)') : null,
                        operation['x-unwire-auth'] ? el('div', { className: 'hint' }, operation['x-unwire-auth']) : null),
                    el('dt', {}, 'Found in'), el('dd', {}, el('code', {}, operation['x-unwire-source'] ?? '-')),
                    el('dt', {}, 'Verified'), el('dd', {}, verified === true ? 'yes, executed against the target' : 'no, derived statically'),
                    el('dt', {}, 'Link'), el('dd', {}, el('a', { href: `#${entry.id}` }, `#${entry.id}`)),
                ),
            )

            const card = el('details', { className: 'operation', id: entry.id }, summary, body)
            // Try it: built on the first open, a closed card costs nothing.
            card.addEventListener('toggle', () => {
                if (card.open && null == entry.tryBlock) {
                    entry.tryBlock = renderTry(entry)
                    body.append(entry.tryBlock)
                }
            })
            entry.card = card
            return card
        }

        // ===========================================================================
        // =============================   RENDER PAGE   =============================
        // ===========================================================================
        //
        //   1. Header                Theme toggle, title, version, description, notice, summary
        //                            cards and the Try it settings.
        //   2. Navigation            Groups with their operations as links, and the group tabs.
        //   3. Groups                One section per group with its operation cards.
        //   4. Open points view      The open points as their own view: whole spec as cards,
        //                            per operation by group.
        //   5. Authentication view   The auth schemes and which operations need which, then
        //                            the view tabs.
        //

        // ---------------------------------------------------------------------------
        // Header
        //   Theme toggle, title, version, description, notice, summary cards and the
        //   Try it settings.
        // ---------------------------------------------------------------------------

        const countBy         = predicate => operations.filter(predicate).length
        const rootOpen        = Array.isArray(spec['x-unwire-open']) ? spec['x-unwire-open'] : []
        const openTotal       = operations.reduce((sum, entry) => sum + entry.open.length, 0) + rootOpen.length
        const documentedCount = countBy(entry => entry.isDocumented)
        const derivedCount    = operations.length - documentedCount

        // Where the operations come from: the notice says it once, the Operations card counts it.
        // - only documented  => taken from the target's own documentation
        // - otherwise        => drafts, derived at least in part from the frontend code
        const notice = derivedCount === 0
            ? 'Taken from documentation the target publishes. Nothing was executed against the target.'
            : 'Nothing was executed against the target: every operation is a draft to review.'
        const origin = documentedCount > 0 && derivedCount > 0
            ? `${documentedCount} documented · ${derivedCount} derived`
            : derivedCount > 0 ? 'derived from the frontend code' : 'from published documentation'

        const levelCounts = Object.fromEntries(['high', 'medium', 'low'].map(level => [level, countBy(entry => entry.confidence === level)]))
        const writeCount  = countBy(entry => entry.isWrite)

        // One card per question: how many, how sure, what changes data, what is open.
        const card = (attributes, label, value, ...rest) => el(attributes.href ? 'a' : 'div', { className: 'card', ...attributes },
            el('div', { className: 'card-label' }, label), el('span', { className: 'card-value' }, value), rest)

        // Theme toggle: switches data-theme on <html> and remembers it, see the script in <head>.
        const isDark      = () => document.documentElement.dataset.theme === 'dark'
        const themeToggle = el('button', { className: 'theme-toggle', type: 'button' })
        const showTheme   = () => {
            themeToggle.textContent = isDark() ? '☀ Light' : '☾ Dark'
            themeToggle.setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode')
        }
        themeToggle.addEventListener('click', () => {
            if (isDark()) delete document.documentElement.dataset.theme
            else document.documentElement.dataset.theme = 'dark'
            // Storage can be blocked, the toggle still works for this visit.
            try { localStorage.setItem('unwire-theme', isDark() ? 'dark' : 'light') } catch { }
            showTheme()
        })
        showTheme()

        document.getElementById('page-header').append(
            themeToggle,
            el('h1', {}, spec.info?.title ?? 'API'),
            el('div', { className: 'version' }, `Version ${spec.info?.version ?? '?'} · OpenAPI ${spec.openapi ?? '?'}`),
            spec.info?.description ? el('p', { className: 'description' }, spec.info.description) : null,
            countBy(entry => entry.operation['x-unwire-verified'] !== true) > 0 ? el('div', { className: 'notice' }, notice) : null,
            el('div', { className: 'summary' },
                card({}, 'Operations', operations.length, el('div', { className: 'card-sub' }, origin)),
                // Confidence: a bar of the shares, the counts, and what the levels mean.
                el('div', { className: 'card wide' },
                    el('div', { className: 'card-label' }, 'Confidence',
                        el('span', { className: 'info', tabindex: '0', role: 'button', 'aria-label': 'What do the confidence levels mean?' }, 'ⓘ',
                            el('span', { className: 'info-box', role: 'tooltip' },
                                el('ul', {}, ['high', 'medium', 'low'].map(level =>
                                    el('li', {}, el('span', { className: `dot ${level}` }), `${level}: ${CONFIDENCE_HINTS[level]}`))),
                                el('p', {}, 'None of them is verified.')))),
                    el('div', { className: 'bar', 'aria-hidden': 'true' }, ['high', 'medium', 'low']
                        .filter(level => levelCounts[level] > 0)
                        .map(level => el('span', { className: level, style: `width: ${100 * levelCounts[level] / operations.length}%` }))),
                    el('div', { className: 'levels' }, ['high', 'medium', 'low'].map(level =>
                        el('span', { title: CONFIDENCE_HINTS[level] }, el('span', { className: `dot ${level}` }), el('strong', {}, levelCounts[level]), level))),
                ),
                card({ title: 'POST, PUT, PATCH and DELETE' }, 'Write', writeCount, el('div', { className: 'card-sub' }, 'change data on the target')),
                openTotal > 0
                    ? card({ href: '#open-points' }, 'Open points', openTotal, el('div', { className: 'card-sub' }, 'not resolved from the code'))
                    : null,
            ),
            renderTrySettings(),
        )

        // ---------------------------------------------------------------------------
        // Navigation
        //   Groups with their operations as links, and the group tabs.
        // ---------------------------------------------------------------------------

        const nav = document.getElementById('page-nav')
        for (const group of groupNames) {
            const items = operations
                .filter(entry => entry.group === group)
                .map(entry => {
                    entry.navItem = el('li', {}, el('a', { href: `#${entry.id}`, title: `${entry.method.toUpperCase()} ${entry.path}` },
                        el('span', { className: `method ${entry.method}` }, entry.method.toUpperCase()),
                        el('span', { className: 'path' }, entry.path)))
                    return entry.navItem
                })
            nav.append(el('div', { 'data-group': group }, el('h2', {}, group), el('ul', {}, items)))
        }
        if (openTotal > 0) nav.append(el('h2', {}, el('a', { href: '#open-points' }, 'Open points')))

        // Group tabs in the toolbar: 'All' (null) plus one per group, each with its count.
        // A prefix before ' · ' is shown muted, so the part that differs stands out.
        // - 'Web · Addresses'  => prefix 'Web · ', name 'Addresses'
        // - 'Order'            => name 'Order'
        const tabLabel = group => {
            const separator = group.lastIndexOf(' · ')
            return separator < 0
                ? [group]
                : [el('span', { className: 'prefix' }, group.slice(0, separator + 3)), group.slice(separator + 3)]
        }
        const groupBar  = document.getElementById('group-bar')
        const groupTabs = new Map([null, ...groupNames].map(group => [group,
            el('button', { className: 'group-tab', type: 'button', title: group ?? 'All groups', 'aria-pressed': group === null ? 'true' : 'false' },
                el('span', { className: 'label' }, group === null ? 'All' : tabLabel(group)), el('span', { className: 'n' }))]))
        groupBar.append(...groupTabs.values())

        // ---------------------------------------------------------------------------
        // Groups
        //   One section per group with its operation cards.
        // ---------------------------------------------------------------------------

        const main = document.getElementById('page-main')
        if (operations.length === 0) main.append(el('p', { className: 'empty' }, 'The spec has no operations.'))
        for (const group of groupNames) {
            main.append(el('section', { className: 'group', 'data-group': group, id: `group-${slug(group)}` },
                el('h2', {}, group),
                tagInfo.get(group)?.description ? el('p', {}, tagInfo.get(group).description) : null,
                operations.filter(entry => entry.group === group).map(renderOperation),
            ))
        }

        // ---------------------------------------------------------------------------
        // Open points view
        //   The open points as their own view: whole spec as cards, per operation by group.
        // ---------------------------------------------------------------------------

        // A short label before the first colon becomes the card title.
        // - 'Auth: Bearer JWT from POST /rest/user/login'  => 'Auth', 'Bearer JWT from ...'
        // - 'Navigation left out (4): /profile and ...'    => 'Navigation left out (4)', '/profile ...'
        // - 'The schema of the body is unknown.'           => no title, the whole text
        const splitPoint = point => {
            const match = /^([A-Z][^:]{0,40}):\s+([\s\S]+)$/.exec(String(point))
            return null == match ? [null, String(point)] : [match[1], match[2]]
        }

        const openView     = document.getElementById('open-view')
        const openEntries  = operations.filter(entry => entry.open.length > 0)
        const opPointCount = openEntries.reduce((sum, entry) => sum + entry.open.length, 0)

        if (openTotal > 0) {
            // Wrapped in el(): it flattens the nested arrays, the native append would print them.
            openView.append(el('div', {},
                el('p', { className: 'lead' }, 'Everything Unwire could not resolve from the code alone. Check these before you rely on an operation.'),
                rootOpen.length > 0 ? [
                    el('h2', {}, 'Whole spec', el('span', {}, rootOpen.length)),
                    el('div', { className: 'point-grid' }, rootOpen.map(point => {
                        const [title, text] = splitPoint(point)
                        return el('article', { className: 'point' }, title ? el('h3', {}, title) : null, el('p', {}, text))
                    })),
                ] : null,
                opPointCount > 0 ? [
                    el('h2', {}, 'Per operation', el('span', {}, opPointCount)),
                    groupNames
                        .filter(group => openEntries.some(entry => entry.group === group))
                        .map(group => el('div', { className: 'op-group' },
                            el('h3', {}, group),
                            openEntries.filter(entry => entry.group === group).map(entry => el('div', { className: 'op-point' },
                                el('a', { href: `#${entry.id}`, title: 'Show this operation' },
                                    el('span', { className: `method ${entry.method}` }, entry.method.toUpperCase()),
                                    el('span', { className: 'path' }, entry.path)),
                                el('ul', {}, entry.open.map(point => el('li', {}, point))),
                            )),
                        )),
                ] : null,
            ))
        }

        // ---------------------------------------------------------------------------
        // Authentication view
        //   The auth schemes and which operations need which, then the view tabs.
        // ---------------------------------------------------------------------------

        // One line per scheme type, as a client would send it.
        // - http bearer JWT         => 'HTTP bearer (JWT) · Authorization: Bearer <token>'
        // - apiKey in header X-Key  => 'API key in header X-Key'
        // - token in the URL path   => 'Token in URL path · /ui/;tok=<value>/'
        // - oauth2 with two flows   => 'OAuth 2 · authorizationCode, clientCredentials'
        const describeScheme = scheme => {
            const type = String(scheme?.type ?? 'unknown')
            if (type === 'http') {
                const name = String(scheme.scheme ?? '').toLowerCase()
                const header = name === 'bearer' ? ' · Authorization: Bearer <token>' : name === 'basic' ? ' · Authorization: Basic <base64 user:password>' : ''
                return `HTTP ${name}${scheme.bearerFormat ? ` (${scheme.bearerFormat})` : ''}${header}`
            }
            if (type === 'apiKey' && scheme['x-unwire-in'] === 'path') return `Token in URL path · ${scheme['x-unwire-path-prefix'] ?? '…'};${scheme.name ?? '?'}=<value>${scheme['x-unwire-path-prefix'] ? '/' : ''}`
            if (type === 'apiKey') return `API key in ${scheme.in ?? '?'} ${scheme.name ?? '?'}`
            if (type === 'oauth2') return `OAuth 2 · ${Object.keys(scheme.flows ?? {}).join(', ') || 'no flows'}`
            if (type === 'openIdConnect') return `OpenID Connect · ${scheme.openIdConnectUrl ?? '?'}`
            return type
        }

        const authView    = document.getElementById('auth-view')
        const schemes     = spec.components?.securitySchemes ?? {}
        const schemeNames = Object.keys(schemes)
        const hasAuthInfo = schemeNames.length > 0 || operations.some(entry => entry.auth.source !== 'none')
        // 'none' first, then the schemes, 'not stated' last.
        const authLabels  = [...new Set(operations.map(entry => entry.auth.label))]
            .sort((a, b) => (a === 'none' ? -1 : b === 'none' ? 1 : a === 'not stated' ? 1 : b === 'not stated' ? -1 : a.localeCompare(b)))
        // Only derived operations: a published spec's own default is what the target documents.
        const defaultCount = countBy(entry => entry.auth.source === 'default' && !entry.isDocumented)
        // Root open points about auth, by their title ('Auth: ...', 'Login: ...').
        const authPoints  = rootOpen.filter(point => /^(auth|login|session|token|csrf|cookie)/i.test(splitPoint(point)[0] ?? ''))

        if (hasAuthInfo) {
            authView.append(el('div', {},
                el('p', { className: 'lead' }, 'How the API is secured, as far as the code and the published documentation show it. Not verified against the target.'),
                schemeNames.length > 0 ? [
                    el('h2', {}, 'Schemes', el('span', {}, schemeNames.length)),
                    el('div', { className: 'point-grid' }, schemeNames.map(name => el('article', { className: 'point scheme' },
                        el('h3', {}, name),
                        el('p', { className: 'scheme-type' }, describeScheme(schemes[name])),
                        schemes[name]?.description ? el('p', {}, schemes[name].description) : null,
                        el('p', { className: 'hint' }, `Used by ${count(countBy(entry => entry.auth.label.split(/ \+ | or /).includes(name)), 'operation')}`),
                    ))),
                ] : null,
                el('h2', {}, 'Who needs what', el('span', {}, operations.length)),
                defaultCount > 0
                    ? el('p', { className: 'note' }, `${count(defaultCount, 'operation')} ${defaultCount === 1 ? 'states' : 'state'} no auth of its own and ${defaultCount === 1 ? 'takes' : 'take'} the spec default. Public endpoints such as a login may be listed under a scheme wrongly.`)
                    : null,
                authLabels.map(label => {
                    const entries = operations.filter(entry => entry.auth.label === label)
                    const kind    = label === 'none' ? 'public' : label === 'not stated' ? 'unknown' : ''
                    return el('details', { className: `auth-need ${kind}`, open: entries.length <= 15 },
                        el('summary', {}, label === 'none' ? 'No auth' : label === 'not stated' ? 'Not stated' : label, el('span', { className: 'n' }, count(entries.length, 'operation'))),
                        // The tooltip says why: x-unwire-auth, the evidence from the code.
                        el('div', { className: 'op-list' }, entries.map(entry => el('a', { href: `#${entry.id}`, title: [`${entry.method.toUpperCase()} ${entry.path}`, entry.operation['x-unwire-auth']].filter(Boolean).join('\n') },
                            el('span', { className: `method ${entry.method}` }, entry.method.toUpperCase()),
                            el('span', { className: 'path' }, entry.path),
                            entry.auth.source === 'default' ? el('span', { className: 'default' }, 'default') : null))),
                    )
                }),
                authPoints.length > 0 ? [
                    el('h2', {}, 'From the analysis', el('span', {}, authPoints.length)),
                    el('div', { className: 'point-grid' }, authPoints.map(point => {
                        const [title, text] = splitPoint(point)
                        return el('article', { className: 'point' }, el('h3', {}, title), el('p', {}, text))
                    })),
                ] : null,
            ))
        }

        // View tabs, only when there is more than the operations to show.
        const viewNav  = document.getElementById('views')
        const viewTabs = [
            ['operations', 'Operations', operations.length],
            openTotal > 0 ? ['open-points', 'Open points', openTotal] : null,
            hasAuthInfo ? ['authentication', 'Authentication', schemeNames.length] : null,
        ].filter(Boolean)
        if (viewTabs.length > 1) {
            viewNav.classList.remove('hidden')
            viewNav.append(...viewTabs.map(([name, label, number]) =>
                el('a', { className: 'view-tab', href: `#${name}`, 'data-view': name }, label, el('span', { className: 'n' }, number))))
        }

        // ===========================================================================
        // ==========================   FILTER OPERATIONS   ==========================
        // ===========================================================================
        //
        //   1. Toolbar height   Keeps anchors and the sticky nav below the toolbar.
        //   2. Filters          Search text, chips and group tabs, combined with AND.
        //   3. Deep link        Opens the card of the operation in the URL hash.
        //

        // ---------------------------------------------------------------------------
        // Toolbar height
        //   Keeps anchors and the sticky nav below the toolbar.
        // ---------------------------------------------------------------------------

        const toolbar        = document.querySelector('.toolbar')
        const measureToolbar = () => document.documentElement.style.setProperty('--toolbar-h', `${toolbar.offsetHeight}px`)
        new ResizeObserver(measureToolbar).observe(toolbar)
        measureToolbar()

        // ---------------------------------------------------------------------------
        // Filters
        //   Search text, chips and group tabs, combined with AND.
        // ---------------------------------------------------------------------------

        /*
            > Search text      -> method, path, summary or operationId contains it
            > Confidence chips -> any pressed confidence matches (OR between them)
            > Write only       -> only write operations
            > Open points      -> only operations with open points
            > Derived only     -> only operations not documented by the target
            > Group tab        -> only operations of that group, 'All' shows every group
            Groups and nav headings without a visible operation are hidden too.
            Each tab counts the matches of its group without the group filter, so it
            tells where a search hits; a tab without matches is hidden.
        */

        const searchInput = document.getElementById('search')
        const chips       = [...document.querySelectorAll('.chip')]
        const resultCount = document.getElementById('result-count')
        let activeGroup   = null     // null = All, set by the group tabs

        function applyFilters() {
            const text        = searchInput.value.trim().toLowerCase()
            const pressed     = new Set(chips.filter(chip => chip.getAttribute('aria-pressed') === 'true').map(chip => chip.dataset.filter))
            const confidences = ['high', 'medium', 'low'].filter(value => pressed.has(value))
            const groupCounts = new Map([...groupTabs.keys()].map(group => [group, 0]))

            let visibleCount = 0
            for (const entry of operations) {
                const haystack = `${entry.method} ${entry.path} ${entry.operation.summary ?? ''} ${entry.operation.operationId ?? ''}`.toLowerCase()
                const isMatch = (text === '' || haystack.includes(text))
                    && (confidences.length === 0 || confidences.includes(entry.confidence))
                    && (!pressed.has('write') || entry.isWrite)
                    && (!pressed.has('open') || entry.open.length > 0)
                    && (!pressed.has('derived') || !entry.isDocumented)
                const isVisible = isMatch && (null === activeGroup || entry.group === activeGroup)
                entry.card.classList.toggle('hidden', !isVisible)
                entry.navItem.classList.toggle('hidden', !isVisible)
                if (isMatch) {
                    groupCounts.set(null, groupCounts.get(null) + 1)
                    groupCounts.set(entry.group, groupCounts.get(entry.group) + 1)
                }
                if (isVisible) visibleCount++
            }

            // Direct children only: lists inside a card (schemas, open points) are no operations.
            for (const container of document.querySelectorAll('[data-group]')) {
                container.classList.toggle('hidden', null == container.querySelector(':scope > .operation:not(.hidden), :scope > ul > li:not(.hidden)'))
            }
            for (const [group, tab] of groupTabs) {
                tab.querySelector('.n').textContent = groupCounts.get(group)
                tab.classList.toggle('hidden', group !== null && group !== activeGroup && groupCounts.get(group) === 0)
                tab.setAttribute('aria-pressed', group === activeGroup ? 'true' : 'false')
            }
            resultCount.textContent = `${visibleCount} of ${count(operations.length, 'operation')}`
        }

        searchInput.addEventListener('input', applyFilters)
        for (const chip of chips) {
            chip.addEventListener('click', () => {
                chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true')
                applyFilters()
            })
        }
        /*
            A tab click keeps the tiles where they are on screen:
            > Toolbar not stuck yet (page near the top) -> no scroll at all
            > Toolbar stuck (scrolled into the list)    -> back to the one position where it just
                                                           sticks, the same for every group
            .layout has min-height 100vh, so a short group never makes the page shorter
            than that position and the browser never clamps the scroll.
        */
        for (const [group, tab] of groupTabs) {
            tab.addEventListener('click', () => {
                const stuckAt = main.getBoundingClientRect().top + window.scrollY - toolbar.offsetHeight - 12
                const isStuck = window.scrollY > stuckAt
                activeGroup = group
                applyFilters()
                if (isStuck) window.scrollTo({ top: stuckAt, behavior: 'instant' })
            })
        }
        applyFilters()

        // ---------------------------------------------------------------------------
        // Deep link
        //   Shows the view of the URL hash and opens the card of an operation.
        // ---------------------------------------------------------------------------

        /*
            > #open-points                  -> the Open points view
            > #authentication               -> the Authentication view
            > anything else (#operations,   -> the Operations view, an operation's card
              an operation id, empty)          opens when the hash names one
            A side view without content (no open points, no auth info) falls back to Operations.
            Switching views scrolls back to the view tabs only when the page is below them,
            so a switch near the top never moves the page.
        */

        const layout    = document.querySelector('.layout')
        const sideViews = new Map([
            ['open-points', openTotal > 0 ? openView : null],
            ['authentication', hasAuthInfo ? authView : null],
        ])
        let currentView = 'operations'

        // Returns the view that is shown, which differs from name when it has no content.
        function showView(name) {
            const view = null != sideViews.get(name) ? name : 'operations'
            toolbar.classList.toggle('hidden', view !== 'operations')
            layout.classList.toggle('hidden', view !== 'operations')
            for (const [key, section] of sideViews) section?.classList.toggle('hidden', key !== view)
            for (const tab of viewNav.querySelectorAll('.view-tab')) {
                if (tab.dataset.view === view) tab.setAttribute('aria-current', 'page')
                else tab.removeAttribute('aria-current')
            }
            const viewTop = viewNav.getBoundingClientRect().top + window.scrollY
            if (view !== currentView && window.scrollY > viewTop) window.scrollTo({ top: viewTop, behavior: 'instant' })
            currentView = view
            return view
        }

        function openFromHash() {
            const id = decodeURIComponent(location.hash.slice(1))
            if (showView(id) !== 'operations') return
            const target = document.getElementById(id)
            // A link into a group that the active tab hides switches back to All.
            if (null !== activeGroup && null != target && null != target.closest('.hidden')) {
                activeGroup = null
                applyFilters()
            }
            if (target?.tagName === 'DETAILS') {
                target.open = true
                target.scrollIntoView({ block: 'start' })
            }
        }
        window.addEventListener('hashchange', openFromHash)
        openFromHash()
    </script>
</body>
</html>
